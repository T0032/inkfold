    const st=[];const col=g('w:color'),cv=col&&col.getAttribute('w:val')||'';if(/^[0-9a-f]{6}$/i.test(cv))st.push('color:#'+cv);
    const hl=g('w:highlight'),sh=g('w:shd'),hv=hl&&hl.getAttribute('w:val'),sf=sh&&sh.getAttribute('w:fill')||'';if(HL[hv])st.push('background-color:'+HL[hv]);else if(/^[0-9a-f]{6}$/i.test(sf))st.push('background-color:#'+sf);
    if(st.length)txt=`<span style="${st.join(';')}">${txt}</span>`}

function mdInline(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>')}
function mdToHtml(t){return t.replace(/\r/g,'').split('\n').map(l=>{let m;if((m=l.match(/^(#{1,3})\s+(.*)$/)))return `<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`;if(/^\s*(---|\*\*\*|___)\s*$/.test(l))return '<hr>';if((m=l.match(/^>\s?(.*)$/)))return `<blockquote>${mdInline(m[1])||'<br>'}</blockquote>`;if((m=l.match(/^\s*[-*+]\s+(.*)$/)))return `<div>• ${mdInline(m[1])}</div>`;return `<div>${mdInline(l)||'<br>'}</div>`}).join('')}
function txtToHtml(t){return t.replace(/\r/g,'').split('\n').map(l=>`<div>${esc(l)||'<br>'}</div>`).join('')}

 try{SND.ctx=SND.ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}

 const yb=y+(lines.length-1)*lh+sz*.95*k;g.globalAlpha=.7;g.fillRect(W/2-40*k,yb,80*k,2*k);g.globalAlpha=.9;
 if(sub){g.font=`500 ${24*k}px "Noto Serif Thai","Leelawadee UI",serif`;g.fillText(sub,W/2,yb+34*k)}g.globalAlpha=1;
 return cv.toDataURL('image/jpeg',.88);
}
async function coverPicker(title,genre,cb){
 try{await Promise.race([Promise.all([document.fonts.load('700 60px "Noto Serif Thai"'),document.fonts.load('500 24px "Noto Serif Thai"')]),new Promise(r=>setTimeout(r,1500))])}catch(e){}
 const ov=document.createElement('div');ov.className='modal-bg cov-ov';ov.style.zIndex=60;
 ov.innerHTML=`<div class="card modal wide" role="dialog" aria-modal="true" aria-label="เลือกปกสำเร็จรูป">${mHead('เลือกปกสำเร็จรูป')}<p class="muted" style="margin:0;font-size:13.5px">ใส่ชื่อ “${esc(title)}” ให้อัตโนมัติ เลือกแล้วเปลี่ยนใหม่ได้ทุกเมื่อ</p>
 <div class="cov-grid">${COVERS.map(c=>`<button class="cov-it" data-cv="${c.id}"><img src="${drawCover(c,title,genre||c.n,300,450)}" alt="ปกแบบ${c.n}"><span>${c.n}</span></button>`).join('')}</div></div>`;
 document.body.appendChild(ov);labelButtons(ov);
 ov.addEventListener('mousedown',e=>{if(e.target===ov)ov.remove()});
 ov.addEventListener('click',e=>{if(e.target.closest('[data-m="close"]'))return ov.remove();const b=e.target.closest('[data-cv]');if(!b)return;const c=COVERS.find(x=>x.id===b.dataset.cv);cb(drawCover(c,title,genre||c.n));ov.remove();toast('ใส่ปกแล้ว — กด “บันทึก” เพื่อยืนยัน')});
}

/* ---------- Inkfold: illustrations + opening book animation ---------- */
const ART={
 book:'<svg class="art" viewBox="0 0 120 80" width="120" height="80" aria-hidden="true"><path d="M60 18c-12-8-30-10-46-6v52c16-4 34-2 46 6 12-8 30-10 46-6V12c-16-4-34-2-46 6z" fill="var(--paper)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><path d="M60 18v52" stroke="var(--accent)" stroke-width="2"/><path d="M24 27c10-2 20-1 28 3M24 37c10-2 20-1 28 3M24 47c10-2 20-1 28 3M68 30c8-4 18-5 28-3M68 40c8-4 18-5 28-3" stroke="var(--line)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M84 10v18l5-4 5 4V9" fill="var(--warm)" opacity=".85"/></svg>',
 quill:'<svg class="art" viewBox="0 0 120 90" width="120" height="90" aria-hidden="true"><rect x="22" y="58" width="40" height="22" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><rect x="32" y="50" width="20" height="10" rx="3" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/><path d="M44 54C60 30 82 14 104 8c-4 20-20 40-46 52" fill="var(--paper)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><path d="M44 54c18-16 34-28 50-38M62 44l8-2M74 34l9-2M86 24l8-2" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>',
};
const QUILL='<svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><path d="M10 40C18 26 28 14 42 6c-2 12-10 24-26 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 40l6-4M18 30c6-6 12-12 20-18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const introOn=()=>!!P.anim;
document.documentElement.classList.toggle('no-anim',!introOn());
function setIntro(on){P.anim=on;savePrefs();document.documentElement.classList.toggle('no-anim',!on);toast(on?'เปิดอนิเมชันแล้ว':'ปิดอนิเมชันแล้ว')}
function playLaunch(){playBook({title:'Inkfold',sub:'โต๊ะเขียนนิยายของคุณ',left:'Inkfold',leftSub:'ทุกเรื่องราวเริ่มจากหน้ากระดาษหนึ่งหน้า',right:'เปิดโต๊ะเขียน…',color:'#5E7A6C'})}
function playBook(o){
 const prev=$('#intro');if(prev)prev.remove();
 const fast=!!o.fast,t=(fast?.55:1)*({slow:1.35,normal:1,fast:.7}[P.speed]||1),n=fast?4:7,s=x=>(x*t).toFixed(3)+'s';
 const leafEnd=1.25+(n-1)*.16+.9,textAt=leafEnd-.3,zoomAt=leafEnd+(fast?.2:.6);
 const el=document.createElement('div');el.id='intro';el.setAttribute('role','presentation');
 el.style.cssText=`--cover:${okColor(o.color)?o.color:'#5E7A6C'};--a-d:${s(.8)};--c-s:${s(.75)};--c-d:${s(1.25)};--tx-s:${s(textAt)};--z-d:${s(.95)}`;
 const front=o.cover&&okImg(o.cover)?`<img src="${o.cover}" alt="">`:`<div class="cf-frame"><div class="cf-em">${QUILL}</div><div class="cf-title">${esc(o.title)}</div>${o.sub?`<div class="cf-sub">${esc(o.sub)}</div>`:''}</div>`;
 el.innerHTML=`<div class="i-zoom"><div class="i-pos"><div class="book">
  <div class="b-half b-back"></div>
  <div class="b-half b-block"><div class="sp sp-r"><div class="sp-orn">❦</div><div>${esc(o.right||'')}</div></div></div>
  ${Array.from({length:n},(_,i)=>`<div class="b-cast r" style="--l-s:${s(1.25+i*.16)};--l-d:${s(.9)}"></div><div class="b-cast l" style="--l-s:${s(1.25+i*.16)};--l-d:${s(.9)}"></div><div class="b-half b-leaf${i===n-1?' last':''}" style="--l-s:${s(1.25+i*.16)};--l-d:${s(.9)};--end:${(-179.4+i*.12).toFixed(2)}deg"><div class="lf"></div><div class="lb">${i===n-1?`<div class="sp sp-l"><div class="sp-t">${esc(o.left||o.title)}</div>${o.leftSub?`<div class="sp-s">${esc(o.leftSub)}</div>`:''}</div>`:''}</div></div>`).join('')}
  <div class="b-half b-cover"><div class="cf">${front}</div><div class="cb"></div></div>
 </div></div></div><button type="button" class="intro-skip">ข้าม ›</button>`;
 document.body.appendChild(el);
 let mid=false,done=false;const timers=[];
 if(P.sound){timers.push(setTimeout(()=>sfx('cover'),.8*t*1000));for(let i=0;i<n;i++)timers.push(setTimeout(()=>sfx('page',.55+Math.random()*.35),(1.3+i*.16)*t*1000))}
 const runMid=()=>{if(!mid){mid=true;try{if(o.onMid)o.onMid()}catch(e){console.error(e)}}};
 const onKey=e=>{if(['Escape','Enter',' '].includes(e.key)){e.preventDefault();e.stopPropagation();finish(true)}};
 function finish(quick){if(done)return;done=true;timers.forEach(clearTimeout);runMid();el.classList.add('out');if(quick)el.classList.add('quick');document.removeEventListener('keydown',onKey,true);setTimeout(()=>el.remove(),quick?350:750)}
 el.addEventListener('click',()=>finish(true));document.addEventListener('keydown',onKey,true);
 timers.push(setTimeout(()=>{el.classList.add('zoom');runMid()},zoomAt*t*1000));
 timers.push(setTimeout(()=>finish(false),(zoomAt+.35)*t*1000));
}

/* ---------- start ---------- */
(async()=>{
 if(P.anim&&P.launch)playLaunch();
 db=await loadDb();
 document.documentElement.dataset.theme=db.settings.theme||'paper';
 await initFileBackup();await loadFonts();
 try{if(navigator.storage&&navigator.storage.persist){ST.persisted=await navigator.storage.persisted()||await navigator.storage.persist()}}catch(e){}
 save();render();
 db.novels.filter(n=>n.cover&&!okColor(n.spine)).forEach(n=>coverColor(n.cover).then(c=>{if(c){n.spine=c;save();if(!S.nid)render()}}));
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
